name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Install Pillow for Image Processing
        run: |
          python3 -m pip install pillow --break-system-packages

      - name: Unpack and Generate Dark/Light Icons
        run: |
          CUSTOM_ICNS=$(find . -maxdepth 2 -name "*.icns" ! -path "*/DerivedData/*" ! -path "*/.git/*" | head -n 1)
          if [ -n "$CUSTOM_ICNS" ] && [ -f "$CUSTOM_ICNS" ]; then
              echo "Found custom icon at: $CUSTOM_ICNS"
              rm -rf custom.iconset
              iconutil -c iconset "$CUSTOM_ICNS" -o custom.iconset
              if [ "$CUSTOM_ICNS" != "./custom_icon.icns" ] && [ "$CUSTOM_ICNS" != "custom_icon.icns" ]; then
                  cp -f "$CUSTOM_ICNS" custom_icon.icns
              fi
          fi

          cat << 'EOF' > generate_icons.py
          import os, glob
          from PIL import Image
          from collections import deque

          src_png = None
          for candidate in ["custom.iconset/icon_512x512@2x.png", "custom.iconset/icon_512x512.png"]:
              if os.path.exists(candidate):
                  src_png = candidate
                  break

          if not src_png:
              candidates = glob.glob("custom.iconset/*.png")
              if candidates:
                  src_png = sorted(candidates, key=lambda f: os.path.getsize(f))[-1]

          if src_png and os.path.exists(src_png):
              print(f"Using source image: {src_png}")
              light_img = Image.open(src_png).convert("RGBA")
              light_img.save("icon_light.png")

              dark_img = light_img.copy()
              w, h = dark_img.size
              pixels = dark_img.load()

              target_dark = (32, 32, 36)
              visited = set()
              queue = deque()

              seeds = [
                  (int(w * 0.15), int(h * 0.15)),
                  (int(w * 0.85), int(h * 0.15)),
                  (int(w * 0.15), int(h * 0.85)),
                  (int(w * 0.85), int(h * 0.85)),
                  (int(w * 0.5),  int(h * 0.12)),
                  (int(w * 0.5),  int(h * 0.88))
              ]

              def is_outer_white(r, g, b, a):
                  return a > 120 and r > 215 and g > 215 and b > 215

              for sx, sy in seeds:
                  if 0 <= sx < w and 0 <= sy < h:
                      r, g, b, a = pixels[sx, sy]
                      if is_outer_white(r, g, b, a):
                          queue.append((sx, sy))
                          visited.add((sx, sy))

              while queue:
                  x, y = queue.popleft()
                  pixels[x, y] = (target_dark[0], target_dark[1], target_dark[2], a)
                  for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
                      nx, ny = x + dx, y + dy
                      if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in visited:
                          nr, ng, nb, na = pixels[nx, ny]
                          if is_outer_white(nr, ng, nb, na):
                              visited.add((nx, ny))
                              queue.append((nx, ny))

              dark_img.save("icon_dark.png")
              print("Successfully generated icon_light.png and icon_dark.png!")
          EOF
          python3 generate_icons.py

      - name: Apply All Patches (v1.9.2 MainActor, Keychain & Code Auto-Fix)
        run: |
          cat << 'EOF' > patch_all.py
          import os, re, subprocess

          # 1. 【核心修复 v1.9.2】：修复 PlaybackSourceExpiry 等文件中 currentMediaSelection 的 MainActor 隔离报错
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "currentMediaSelection" in content and "MainActor.assumeIsolated" not in content:
                              # 将 xx.currentMediaSelection 包裹进 MainActor.assumeIsolated，穿透并发检查
                              new_content = re.sub(
                                  r'([a-zA-Z0-9_\.]+)(\??)\.currentMediaSelection',
                                  r'(MainActor.assumeIsolated { \1\2.currentMediaSelection })',
                                  content
                              )
                              if new_content != content:
                                  with open(path, "w", encoding="utf-8") as f:
                                      f.write(new_content)
                                  print(f"Patched MainActor currentMediaSelection in: {path}")
                      except Exception as e:
                          pass

          # 2. 全局降级 SWIFT_STRICT_CONCURRENCY（防止 Swift 6 并发检查误判）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          c2 = c.replace("SWIFT_STRICT_CONCURRENCY = complete", "SWIFT_STRICT_CONCURRENCY = minimal")
                          c2 = c2.replace("SWIFT_STRICT_CONCURRENCY = targeted", "SWIFT_STRICT_CONCURRENCY = minimal")
                          if c != c2:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c2)
                              print(f"Set SWIFT_STRICT_CONCURRENCY to minimal in: {path}")
                      except Exception:
                          pass

          # 3. 解决 Keychain 权限拦截与“登录未完成”弹窗（平滑支持 TV 凭证与本地 UserDefaults 兜底）
          cred_file = "Packages/BiliKitCore/Sources/BiliAuth/Credential/WebCredentialStore.swift"
          if os.path.exists(cred_file):
              with open(cred_file, "r", encoding="utf-8") as f:
                  code = f.read()

              # 清除所有 Data Protection Keychain 与 Access Group 限制
              code = re.sub(r'[\'"]?kSecUseDataProtectionKeychain[\'"]?\s*(?:as\s*String)?\s*:\s*(?:true|kCFBooleanTrue)\s*,?', '', code)
              code = re.sub(r'\w+\[\s*kSecUseDataProtectionKeychain\s*(?:as\s*String)?\s*\]\s*=\s*(?:true|kCFBooleanTrue)\s*;?', '', code)
              code = re.sub(r'[\'"]?kSecAttrAccessGroup[\'"]?\s*(?:as\s*String)?\s*:\s*[^,\n\}]+,?', '', code)
              code = re.sub(r'\w+\[\s*kSecAttrAccessGroup\s*(?:as\s*String)?\s*\]\s*=\s*[^;\n]+;?', '', code)
              code = code.replace("kSecAttrAccessibleWhenUnlockedThisDeviceOnly", "kSecAttrAccessibleAfterFirstUnlock")

              # 消除阻断登录的 throw WebCredentialStoreError.unavailable
              code = re.sub(r'throw\s+WebCredentialStoreError\.(?:unavailable|interactionNotAllowed)', 'return', code)

              # 在 load() 注入本地兜底读取
              fallback_load_snippet = """
                  if let fallbackData = UserDefaults.standard.data(forKey: "bili_kit_web_credential_local_backup"),
                     let fallbackCred = try? WebCredentialCodec.decode(fallbackData) {
                      return fallbackCred
                  }
              """
              if "UserDefaults.standard.data(forKey: \"bili_kit_web_credential_local_backup\")" not in code:
                  code = re.sub(r'(\n\s*return\s+nil\s*\n\s*\})', f'\n{fallback_load_snippet}\\1', code, count=1)

              # 在 save() 注入本地备份写入
              save_backup_snippet = """
                  if let backupData = try? WebCredentialCodec.encode(credential) {
                      UserDefaults.standard.set(backupData, forKey: "bili_kit_web_credential_local_backup")
                  }
              """
              if "UserDefaults.standard.set(backupData, forKey: \"bili_kit_web_credential_local_backup\")" not in code:
                  code = re.sub(r'(func\s+save\s*\([^)]*\)[^{]*\{)', f'\\1\n{save_backup_snippet}', code, count=1)

              # 在 delete() 同步清理本地备份
              delete_snippet = """
                  UserDefaults.standard.removeObject(forKey: "bili_kit_web_credential_local_backup")
              """
              if "UserDefaults.standard.removeObject(forKey: \"bili_kit_web_credential_local_backup\")" not in code:
                  code = re.sub(r'(func\s+delete\s*\([^)]*\)[^{]*\{)', f'\\1\n{delete_snippet}', code, count=1)

              with open(cred_file, "w", encoding="utf-8") as f:
                  f.write(code)
              print("Patched WebCredentialStore.swift successfully!")

          # 4. 全项目清理 kSecUseDataProtectionKeychain
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          c2 = re.sub(r'[\'"]?kSecUseDataProtectionKeychain[\'"]?\s*(?:as\s*String)?\s*:\s*(?:true|kCFBooleanTrue)\s*,?', '', c)
                          c2 = re.sub(r'[\'"]?kSecAttrAccessGroup[\'"]?\s*(?:as\s*String)?\s*:\s*[^,\n\}]+,?', '', c2)
                          c2 = c2.replace("kSecAttrAccessibleWhenUnlockedThisDeviceOnly", "kSecAttrAccessibleAfterFirstUnlock")
                          if c != c2:
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c2)
                      except Exception:
                          pass

          # 5. 消除 -warnings-as-errors 冲突
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 6. 修复 URLSessionRangeTransport.swift 循环引用
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              if "let (pending, session) = lock.withLock" in content:
                  content = content.replace("let (pending, session) = lock.withLock", "let (pending, activeSession) = lock.withLock")
                  content = content.replace("session?.finishTasksAndInvalidate()", "activeSession?.finishTasksAndInvalidate()")
                  content = content.replace("session?.invalidateAndCancel()", "activeSession?.invalidateAndCancel()")
                  content = content.replace("session.invalidateAndCancel()", "activeSession.invalidateAndCancel()")
                  with open(target_file, "w", encoding="utf-8") as f:
                      f.write(content)

          # 7. 修复 NSColor.quinaryLabelColor 重命名
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          if "quinaryLabelColor" in c:
                              c = c.replace("quinaryLabelColor", "quinaryLabel")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                      except Exception:
                          pass

          # 8. 向下兼容 LoudnessAudioMix.swift（若存在）
          mix_file = "Packages/BiliKitCore/Sources/BiliPlayback/Audio/LoudnessAudioMix.swift"
          if os.path.exists(mix_file):
              with open(mix_file, "r", encoding="utf-8") as f:
                  m_code = f.read()
              shim = """import CoreMedia
          extension CMPersistentTrackID {
              var rawValue: CMPersistentTrackID { self }
          }
          """
              m_code = re.sub(r'AVAudioMixInputParametersTrackID(?:\.[a-zA-Z0-9_\(\)]+)*', 'kCMPersistentTrackID_Invalid', m_code)
              m_code = re.sub(r'kCMPersistentTrackID_Invalid(?:\.[a-zA-Z0-9_\(\)]+)+', 'kCMPersistentTrackID_Invalid', m_code)
              m_code = shim + "\n" + m_code
              with open(mix_file, "w", encoding="utf-8") as f:
                  f.write(m_code)

          # 9. 向下兼容 LoudnessProcessingTap.swift（若存在）
          loudness_file = "Packages/BiliKitCore/Sources/BiliPlayback/Audio/LoudnessProcessingTap.swift"
          if os.path.exists(loudness_file):
              try:
                  orig_code = subprocess.check_output(["git", "show", f"HEAD:{loudness_file}"], text=True)
              except Exception:
                  orig_code = ""

              make_match = re.search(r"(public\s+|open\s+)?(static\s+func\s+make[^{]+)", orig_code)
              make_sig = make_match.group(0).strip() if make_match else "static func make(for playerItem: AVPlayerItem, policy: Any? = nil) -> LoudnessProcessingTap?"

              mix_match = re.search(r"(public\s+|open\s+)?(func\s+makeAudioMix[^{]+)", orig_code)
              mix_sig = mix_match.group(0).strip() if mix_match else "func makeAudioMix() -> AVAudioMix"

              gain_match = re.search(r"(public\s+|open\s+)?(func\s+setTargetGain[^{]+)", orig_code)
              gain_sig = gain_match.group(0).strip() if gain_match else "func setTargetGain(_ targetGain: Float, rampDuration: TimeInterval = 0)"

              stub_loudness = f"""import Foundation
          import AVFoundation
          import MediaToolbox

          final class LoudnessProcessingTap: @unchecked Sendable {{
              init() {{}}
              {make_sig} {{
                  return LoudnessProcessingTap()
              }}
              {mix_sig} {{
                  return AVAudioMix()
              }}
              {gain_sig} {{}}
          }}
          """
              with open(loudness_file, "w", encoding="utf-8") as f:
                  f.write(stub_loudness)

          # 10. 移除 App Sandbox 与 Keychain Access Groups（防止权限拦截）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".entitlements"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              ent = f.read()
                          ent = re.sub(r"<key>com.apple.security.app-sandbox</key>\s*<true/>", "<key>com.apple.security.app-sandbox</key><false/>", ent)
                          ent = re.sub(r"<key>keychain-access-groups</key>\s*<array>.*?</array>", "", ent, flags=re.DOTALL)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(ent)
                          print(f"Patched entitlements: {path}")
                      except Exception:
                          pass

          # 11. 禁用 Sparkle 自动更新检查
          for root, dirs, files in os.walk("."):
              for file in files:
                  if "Info.plist" in file:
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              plist = f.read()
                          if "</dict>" in plist:
                              sparkle_block = "<key>SUEnableAutomaticChecks</key><false/><key>SUAutomaticallyUpdate</key><false/>\n</dict>"
                              plist = plist.replace("</dict>", sparkle_block, 1)
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(plist)
                              print(f"Disabled Sparkle auto-update in: {path}")
                      except Exception:
                          pass

          # 12. 注入符合 Swift 6 并发安全的主题切换器
          app_file = "BiliKitMac/App/BiliKitMacApp.swift"
          if os.path.exists(app_file):
              with open(app_file, "r", encoding="utf-8") as f:
                  app_code = f.read()

              helper_class = """import AppKit

          final class ThemeIconSwitcher: NSObject, @unchecked Sendable {
              static let shared = ThemeIconSwitcher()
              func start() {
                  DispatchQueue.main.async {
                      self.update()
                  }
                  DistributedNotificationCenter.default().addObserver(
                      forName: Notification.Name("AppleInterfaceThemeChangedNotification"),
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      self?.update()
                  }
              }
              func update() {
                  let isDark = NSApp.effectiveAppearance.bestMatch(from: [.darkAqua, .aqua]) == .darkAqua
                  let file = isDark ? "icon_dark.png" : "icon_light.png"
                  if let path = Bundle.main.path(forResource: file, ofType: nil),
                     let image = NSImage(contentsOfFile: path) {
                      NSApp.applicationIconImage = image
                  }
              }
          }
          """

              if "ThemeIconSwitcher.shared.start()" not in app_code:
                  if "init()" in app_code:
                      app_code = app_code.replace("init() {", "init() {\n        ThemeIconSwitcher.shared.start()\n")
                  else:
                      app_code = app_code.rstrip()
                      if app_code.endswith("}"):
                          app_code = app_code[:-1] + "\n    init() {\n        ThemeIconSwitcher.shared.start()\n    }\n}\n"

              if "final class ThemeIconSwitcher" not in app_code:
                  app_code = app_code.strip() + "\n\n" + helper_class + "\n"

              with open(app_file, "w", encoding="utf-8") as f:
                  f.write(app_code)
              print("Injected ThemeIconSwitcher safely!")
          EOF
          python3 patch_all.py

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          set -o pipefail
          SCHEME="BiliKitMac"
          echo "Explicitly Target Scheme: $SCHEME"

          xcodebuild -resolvePackageDependencies -project BiliKitMac.xcodeproj -scheme "$SCHEME" || true

          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath ./DerivedData 2>&1 | tee xcodebuild.log || {
              echo "==================== [编译错误精确定位] ===================="
              grep -E "error:|fatal error:|\*\* BUILD FAILED \*\*" xcodebuild.log | grep -v "SWIFT_TREAT_WARNINGS_AS_ERRORS" | head -n 35
              echo "=========================================================="
              exit 1
            }

      - name: Force Custom Icon & Ad-hoc Sign App
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi

          # 1. 移除 CFBundleIconName 破坏 Assets.car 对旧图标的优先锁定
          echo "Bypassing Assets.car icon priority..."
          /usr/libexec/PlistBuddy -c "Delete :CFBundleIconName" "$APP_PATH/Contents/Info.plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconFile AppIcon" "$APP_PATH/Contents/Info.plist" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleIconFile string AppIcon" "$APP_PATH/Contents/Info.plist"

          # 2. 覆盖默认 AppIcon.icns
          ICNS_TARGET=$(find . -maxdepth 2 -name "*.icns" ! -path "*/DerivedData/*" ! -path "*/.git/*" | head -n 1)
          if [ -n "$ICNS_TARGET" ] && [ -f "$ICNS_TARGET" ]; then
              cp -f "$ICNS_TARGET" "$APP_PATH/Contents/Resources/AppIcon.icns"
              echo "Replaced AppIcon.icns with: $ICNS_TARGET"
          fi

          # 3. 拷入动态切换图层
          if [ -f "icon_light.png" ] && [ -f "icon_dark.png" ]; then
              cp -f icon_light.png "$APP_PATH/Contents/Resources/icon_light.png"
              cp -f icon_dark.png "$APP_PATH/Contents/Resources/icon_dark.png"
              echo "Bundled dynamic light and dark theme icons."
          fi

          # 4. 架构验证
          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          # 5. 生成专为 Ad-hoc 免证书签名的干净 Entitlements（无沙盒、全网络通行、不设 Access Group）
          cat << 'EOF' > adhoc.entitlements
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.app-sandbox</key>
              <false/>
              <key>com.apple.security.network.client</key>
              <true/>
              <key>com.apple.security.network.server</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "Signing with clean adhoc.entitlements..."
          codesign --force --deep --sign - --entitlements adhoc.entitlements "$APP_PATH"

          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
