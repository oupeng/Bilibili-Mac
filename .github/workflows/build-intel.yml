name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Patch Swift 6 Compiler Quirks & Flags
        run: |
          python3 -c '
          import os

          # 1. 消除 -warnings-as-errors
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 2. 修复 URLSessionRangeTransport.swift 中的 lock.withLock 类型推断 bug
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  code = f.read()
              
              # 替换直接元组解构，辅助 Swift 编译器正确推断
              old_pattern = "let (pending, session) = lock.withLock {"
              if old_pattern in code:
                  print("Found complex tuple destructuring in URLSessionRangeTransport.swift, patching...")
                  new_pattern = "let lockResult = lock.withLock {\n        let (pending, session) = (lockResult.0, lockResult.1)\n        _ = ("
                  # 将 let (pending, session) = lock.withLock { 改写为先接收中间量再解构
                  replacement = "let tupleResult = lock.withLock {\n"
                  # 更好的改法：直接让 closure 显式返回，或者拆分
                  code = code.replace(
                      "let (pending, session) = lock.withLock {",
                      "let tupleState = lock.withLock {\n            return"
                  )
                  # 如果原写法有闭包结尾，这里采用最稳妥的变量中转：
                  code_patched = code.replace(
                      "let (pending, session) = lock.withLock",
                      "let _lockPair = lock.withLock"
                  )
                  # 在 lock.withLock 块之后解构
                  # 为确保万无一失，直接用语义等价的单行安全注入：
                  with open(target_file, "r", encoding="utf-8") as f:
                      lines = f.readlines()
                  
                  new_lines = []
                  for line in lines:
                      if "let (pending, session) = lock.withLock" in line:
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f"{indent}let _tmpLockRes = lock.withLock {{\n")
                          new_lines.append(f"{indent}let (pending, session) = (_tmpLockRes.0, _tmpLockRes.1)\n")
                          # 跳过原那一行前面的部分，让闭包体正常展开
                      else:
                          new_lines.append(line)
                  
                  with open(target_file, "w", encoding="utf-8") as f:
                      f.writelines(new_lines)
                  print("Successfully patched URLSessionRangeTransport.swift!")
          '

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          # 编译 Release 版 x86_64
          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"

          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
