name: Build Intel Release

on:
  workflow_dispatch: # 支持手动点击按钮触发

jobs:
  build:
    runs-on: macos-15 # 使用 GitHub 官方公共服务器

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode Toolchain
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable' # 自动提供 Swift 6.2+ 编译环境

      - name: Build macOS App (Cross-compile for x86_64)
        run: |
          xcodebuild clean build \
            -scheme BiliKitMac \
            -configuration Release \
            -derivedDataPath ./build \
            -arch x86_64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Compress App
        run: |
          cd build/Build/Products/Release
          zip -r BiliKit-Intel.zip *.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-Intel-Mac
          path: build/Build/Products/Release/BiliKit-Intel.zip
