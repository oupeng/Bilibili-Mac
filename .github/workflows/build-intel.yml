name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Patch Swift 6 Compiler Quirks & Flags
        run: |
          python3 -c '
          import os

          # 1. 消除 -warnings-as-errors 冲突
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 2. 精准修复 URLSessionRangeTransport.swift 闭包花括号结构
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()

              target_str = "let (pending, session) = lock.withLock"
              idx = content.find(target_str)
              if idx != -1:
                  brace_start = content.find("{", idx)
                  brace_count = 0
                  brace_end = -1
                  for i in range(brace_start, len(content)):
                      if content[i] == "{":
                          brace_count += 1
                      elif content[i] == "}":
                          brace_count -= 1
                          if brace_count == 0:
                              brace_end = i
                              break

                  if brace_end != -1:
                      before = content[:idx] + "let _lockPair = lock.withLock"
                      closure_body = content[idx + len(target_str) : brace_end + 1]
                      after = content[brace_end + 1 :]
                      # 将解构语句准确放置在闭包结束的大括号之后
                      new_content = before + closure_body + "\n        let (pending, session) = (_lockPair.0, _lockPair.1)" + after

                      with open(target_file, "w", encoding="utf-8") as f:
                          f.write(new_content)
                      print("Successfully and cleanly patched URLSessionRangeTransport.swift!")
          '

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          # 编译 Release 版 x86_64
          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi
          echo "Found compiled app at: $APP_PATH"

          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
