name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch: # 支持网页端手动点击触发

jobs:
  build:
    runs-on: macos-26 # 对应你当前的系统环境

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          # 1. 动态确定 App 主 Scheme（优先匹配 BiliKitMac 或 BiliKit）
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          # 2. 编译并解决 warning 参数冲突与架构切片
          # 注意：去除了 clean 指令以避免目录权限冲突；指定 -derivedDataPath 让 Xcode 自行管理产物路径
          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          # 3. 在 DerivedData 中查找编译生成的 .app 产物
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译好的 .app 文件！"
            exit 1
          fi
          echo "Successfully generated App at: $APP_PATH"

          # 4. 打印架构信息（日志中会确认是否为 x86_64）
          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          # 5. Ad-hoc 签名并压缩
          codesign --force --deep --sign - "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
