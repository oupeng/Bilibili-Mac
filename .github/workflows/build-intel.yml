name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Install Pillow for Image Processing
        run: |
          # 加上 --break-system-packages 绕过 Homebrew 的 PEP 668 外部环境锁定
          python3 -m pip install pillow --break-system-packages

      - name: Unpack and Generate Dark/Light Icons
        run: |
          # 1. 如果根目录下存在 custom_icon.icns，使用 macOS 原生 iconutil 无损解包
          if [ -f "custom_icon.icns" ]; then
              echo "Found custom_icon.icns, unpacking..."
              rm -rf custom.iconset
              iconutil -c iconset custom_icon.icns -o custom.iconset
          else
              echo "Warning: custom_icon.icns not found in root, using existing AppIcon."
          fi

          # 2. Python 提取最高清原图并算法生成深色模式版本
          python3 -c '
          import os, glob
          from PIL import Image
          from collections import deque

          # 查找解包出的最高分辨率 PNG (优先 512x512@2x 即 1024x1024)
          src_png = None
          for candidate in ["custom.iconset/icon_512x512@2x.png", "custom.iconset/icon_512x512.png"]:
              if os.path.exists(candidate):
                  src_png = candidate
                  break

          if not src_png:
              candidates = glob.glob("custom.iconset/*.png")
              if candidates:
                  src_png = sorted(candidates, key=lambda f: os.path.getsize(f))[-1]

          if src_png and os.path.exists(src_png):
              print(f"Using source image: {src_png}")
              light_img = Image.open(src_png).convert("RGBA")
              light_img.save("icon_light.png")

              # 算法生成深色模式版：通过广度优先搜索(BFS)仅将小电视外部的白色底替换为暗夜灰
              dark_img = light_img.copy()
              w, h = dark_img.size
              pixels = dark_img.load()

              target_dark = (32, 32, 36) # macOS 暗色系统质感灰
              visited = set()
              queue = deque()

              # 从外围 4 个角落与边缘采样（位于外部圆角背景区域，在粉色小电视边框之外）
              seeds = [
                  (int(w * 0.15), int(h * 0.15)),
                  (int(w * 0.85), int(h * 0.15)),
                  (int(w * 0.15), int(h * 0.85)),
                  (int(w * 0.85), int(h * 0.85)),
                  (int(w * 0.5),  int(h * 0.12)),
                  (int(w * 0.5),  int(h * 0.88))
              ]

              def is_outer_white(r, g, b, a):
                  return a > 120 and r > 215 and g > 215 and b > 215

              for sx, sy in seeds:
                  if 0 <= sx < w and 0 <= sy < h:
                      r, g, b, a = pixels[sx, sy]
                      if is_outer_white(r, g, b, a):
                          queue.append((sx, sy))
                          visited.add((sx, sy))

              while queue:
                  x, y = queue.popleft()
                  r, g, b, a = pixels[x, y]
                  pixels[x, y] = (target_dark[0], target_dark[1], target_dark[2], a)
                  for dx, dy in [(-1, 0), (1, 0), (0, -1), (0, 1)]:
                      nx, ny = x + dx, y + dy
                      if 0 <= nx < w and 0 <= ny < h and (nx, ny) not in visited:
                          nr, ng, nb, na = pixels[nx, ny]
                          if is_outer_white(nr, ng, nb, na):
                              visited.add((nx, ny))
                              queue.append((nx, ny))

              dark_img.save("icon_dark.png")
              print("Successfully generated icon_light.png and icon_dark.png!")
          '

