name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Patch Swift 6 Compiler Quirks & Keychain Entitlements
        run: |
          python3 -c '
          import os, re

          # 1. 消除 -warnings-as-errors 冲突
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 2. 解决 URLSessionRangeTransport.swift 中的循环引用
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              if "let (pending, session) = lock.withLock" in content:
                  content = content.replace(
                      "let (pending, session) = lock.withLock",
                      "let (pending, activeSession) = lock.withLock"
                  )
                  content = content.replace("session?.finishTasksAndInvalidate()", "activeSession?.finishTasksAndInvalidate()")
                  content = content.replace("session?.invalidateAndCancel()", "activeSession?.invalidateAndCancel()")
                  content = content.replace("session.invalidateAndCancel()", "activeSession.invalidateAndCancel()")
                  with open(target_file, "w", encoding="utf-8") as f:
                      f.write(content)

          # 3. 修复 AppKit NSColor.quinaryLabelColor
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          if "quinaryLabelColor" in c:
                              c = c.replace("quinaryLabelColor", "quinaryLabel")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                      except Exception:
                          pass

          # 4. 移除 Entitlements 中的 keychain-access-groups（消除自签名 Keychain 权限被拒问题）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".entitlements"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              ent = f.read()
                          if "keychain-access-groups" in ent:
                              print(f"Removing keychain-access-groups from: {path}")
                              # 清除 keychain-access-groups 键值块
                              ent = re.sub(r"<key>keychain-access-groups</key>\s*<array>.*?</array>", "", ent, flags=re.DOTALL)
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(ent)
                      except Exception:
                          pass

          # 5. 检查 WebCredentialStore.swift，若指定了 kSecAttrAccessGroup，将其清除
          for root, dirs, files in os.walk("Packages/BiliKitCore"):
              for file in files:
                  if file == "WebCredentialStore.swift" or file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              code = f.read()
                          if "kSecAttrAccessGroup" in code:
                              print(f"Disabling kSecAttrAccessGroup in: {path}")
                              code = re.sub(r'kSecAttrAccessGroup\s*as\s*String\s*:\s*[^,\n]+', 'kSecAttrAccessible as String: kSecAttrAccessibleAfterFirstUnlock', code)
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(code)
                      except Exception:
                          pass

          print("Keychain patch finished!")
          '

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi

          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          # 寻找现有的 entitlements 文件一同签名（如果有），若无则普通深层自签名
          ENT_FILE=$(find . -name "*.entitlements" | head -n 1)
          if [ -n "$ENT_FILE" ]; then
              echo "Signing with entitlements: $ENT_FILE"
              codesign --force --deep --sign - --entitlements "$ENT_FILE" "$APP_PATH"
          else
              codesign --force --deep --sign - "$APP_PATH"
          fi

          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
