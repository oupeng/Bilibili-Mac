name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Prepare macOS 26 Liquid Glass App Icon
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import subprocess
          import json

          icon_icns = "custom_icon.icns"
          iconset_dir = "temp_custom.iconset"
          icon_bundle = "generated_appicon.icon"
          assets_dir = os.path.join(icon_bundle, "Assets")
          icon_json = os.path.join(icon_bundle, "icon.json")

          if not os.path.isfile(icon_icns):
              raise SystemExit("::error:: custom_icon.icns not found in repository root")

          print("=== Preparing custom icon for macOS 26 Icon Composer ===")

          shutil.rmtree(iconset_dir, ignore_errors=True)
          shutil.rmtree(icon_bundle, ignore_errors=True)

          # Extract the existing ICNS into standard-resolution PNGs.
          subprocess.run(
              ["iconutil", "--convert", "iconset", icon_icns, "--output", iconset_dir],
              check=True
          )

          # Use the 1024px source as the single artwork layer.
          source_png = os.path.join(iconset_dir, "icon_512x512@2x.png")
          if not os.path.isfile(source_png):
              raise SystemExit(
                  "::error:: custom_icon.icns does not contain icon_512x512@2x.png"
              )

          os.makedirs(assets_dir, exist_ok=True)
          shutil.copy2(source_png, os.path.join(assets_dir, "BiliKit.png"))

          # A single-layer .icon is intentionally used here because the only
          # supplied artwork is a flattened ICNS. Icon Composer applies the
          # macOS 26 Liquid Glass material, masking, lighting and appearance
          # treatment at runtime.
          icon_definition = {
              "fill": "none",
              "groups": [
                  {
                      "layers": [
                          {
                              "image-name": "BiliKit.png",
                              "name": "BiliKit",
                              "glass": True
                          }
                      ],
                      "lighting": "individual",
                      "shadow": {
                          "kind": "neutral",
                          "opacity": 0.5
                      },
                      "specular": True,
                      "translucency": {
                          "enabled": True,
                          "value": 0.5
                      }
                  }
              ],
              "supported-platforms": {
                  "squares": ["macOS"]
              }
          }

          with open(icon_json, "w", encoding="utf-8") as f:
              json.dump(icon_definition, f, indent=2)

          print("Generated:", icon_bundle)
          print("Artwork:", os.path.join(assets_dir, "BiliKit.png"))
          print("Icon Composer manifest:", icon_json)
          PY

      - name: Apply All Patches (Warnings, Syntax, Keychain, Sandbox & Updater)
        run: |
          python3 -c '
          import os, re

          # 1. 消除 -warnings-as-errors 冲突
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 2. 修复 URLSessionRangeTransport.swift 循环引用
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              if "let (pending, session) = lock.withLock" in content:
                  content = content.replace("let (pending, session) = lock.withLock", "let (pending, activeSession) = lock.withLock")
                  content = content.replace("session?.finishTasksAndInvalidate()", "activeSession?.finishTasksAndInvalidate()")
                  content = content.replace("session?.invalidateAndCancel()", "activeSession?.invalidateAndCancel()")
                  content = content.replace("session.invalidateAndCancel()", "activeSession.invalidateAndCancel()")
                  with open(target_file, "w", encoding="utf-8") as f:
                      f.write(content)

          # 3. 修复 NSColor.quinaryLabelColor 重命名
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          if "quinaryLabelColor" in c:
                              c = c.replace("quinaryLabelColor", "quinaryLabel")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                      except Exception:
                          pass

          # 4. 关键修复：关闭 App Sandbox 与 Keychain Access Groups（根除登录失败）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".entitlements"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              ent = f.read()
                          # 关闭沙盒
                          ent = re.sub(r"<key>com.apple.security.app-sandbox</key>\s*<true/>", "<key>com.apple.security.app-sandbox</key><false/>", ent)
                          # 移除钥匙串共享组
                          ent = re.sub(r"<key>keychain-access-groups</key>\s*<array>.*?</array>", "", ent, flags=re.DOTALL)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(ent)
                          print(f"Patched entitlements: {path}")
                      except Exception:
                          pass

          # 5. 关键修复：禁用 Sparkle 自动更新检查（避免自动下载纯 M 芯片版本覆盖损坏）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if "Info.plist" in file:
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              plist = f.read()
                          if "</dict>" in plist:
                              sparkle_block = "<key>SUEnableAutomaticChecks</key><false/><key>SUAutomaticallyUpdate</key><false/>\n</dict>"
                              plist = plist.replace("</dict>", sparkle_block, 1)
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(plist)
                              print(f"Disabled Sparkle auto-update in: {path}")
                      except Exception:
                          pass

          print("All deep patches finished successfully!")
          '

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          set -euo pipefail

          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi

          echo "=== Install macOS 26 Icon Composer icon ==="

          if [ ! -d "generated_appicon.icon" ]; then
            echo "::error::generated_appicon.icon not found!"
            exit 1
          fi

          RESOURCES="$APP_PATH/Contents/Resources"

          echo "=== Remove old compiled icon resources ==="

          # Remove the old Assets.car so the Icon Composer asset is the
          # authoritative AppIcon resource.
          rm -f "$RESOURCES/Assets.car"

          # Remove old ICNS files generated by Xcode.
          # We will restore custom_icon.icns as AppIcon.icns below as a
          # legacy/fallback representation.
          find "$RESOURCES" -maxdepth 1 -name "*.icns" -delete

          echo "=== Compile Icon Composer package with actool ==="

          PARTIAL_PLIST="$RUNNER_TEMP/AppIcon-partial-Info.plist"

          xcrun actool \
            "generated_appicon.icon" \
            --compile "$RESOURCES" \
            --platform macosx \
            --target-device mac \
            --minimum-deployment-target 26.0 \
            --app-icon AppIcon \
            --output-format human-readable-text \
            --output-partial-info-plist "$PARTIAL_PLIST"

          echo "=== Verify actool output ==="

          if [ ! -f "$RESOURCES/Assets.car" ]; then
            echo "::error::actool did not generate Assets.car"
            exit 1
          fi

          if [ ! -f "$PARTIAL_PLIST" ]; then
            echo "::error::actool did not generate the partial Info.plist"
            exit 1
          fi

          echo "--- Assets.car ---"
          ls -lh "$RESOURCES/Assets.car"

          echo "--- Partial Info.plist ---"
          plutil -p "$PARTIAL_PLIST"

          # Keep the supplied custom ICNS as a fallback.
          #
          # macOS 26 should resolve the modern Icon Composer representation
          # through CFBundleIconName. The ICNS remains available as a
          # compatibility/fallback resource and prevents the application
          # from having no icon if the modern representation is unavailable.
          cp custom_icon.icns "$RESOURCES/AppIcon.icns"

          echo "--- AppIcon.icns ---"
          ls -lh "$RESOURCES/AppIcon.icns"

          echo "=== Merge actool icon metadata into application Info.plist ==="

          PLIST_PATH="$APP_PATH/Contents/Info.plist"

          if [ ! -f "$PLIST_PATH" ]; then
            echo "::error::Info.plist not found"
            exit 1
          fi

          python3 - "$PLIST_PATH" "$PARTIAL_PLIST" <<'PY'
          import plistlib
          import sys

          plist_path = sys.argv[1]
          partial_path = sys.argv[2]

          with open(plist_path, "rb") as f:
              data = plistlib.load(f)

          with open(partial_path, "rb") as f:
              partial = plistlib.load(f)

          # Import the icon metadata produced by actool.
          #
          # Do not blindly replace the entire Info.plist because the
          # application contains unrelated configuration entries.
          for key in (
              "CFBundleIconName",
              "CFBundleIcons",
              "CFBundleIconFiles",
          ):
              if key in partial:
                  data[key] = partial[key]

          # Modern macOS 26 Icon Composer entry.
          data["CFBundleIconName"] = "AppIcon"

          # Legacy/fallback ICNS entry.
          data["CFBundleIconFile"] = "AppIcon"

          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)

          print("=== Final icon configuration ===")
          print("CFBundleIconName =", data.get("CFBundleIconName"))
          print("CFBundleIconFile =", data.get("CFBundleIconFile"))
          print("CFBundleIconFiles =", data.get("CFBundleIconFiles"))
          print("CFBundleIcons =", data.get("CFBundleIcons"))
          PY

          echo "=== Verify final icon resources ==="

          ls -lah "$RESOURCES" | grep -E 'Assets\.car|AppIcon\.icns' || true

          echo "=== Verify Info.plist ==="
          plutil -p "$PLIST_PATH" | grep -E 'CFBundleIcon|Icon'

          echo "=== Architecture verification ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          # Refresh package metadata.
          touch "$PLIST_PATH"
          touch "$APP_PATH"

          echo "=== Ad-hoc signing ==="

          ENT_FILE=$(find . -name "*.entitlements" -print -quit)

          if [ -n "$ENT_FILE" ]; then
            echo "Signing with non-sandbox entitlements: $ENT_FILE"

            codesign \
              --force \
              --deep \
              --sign - \
              --entitlements "$ENT_FILE" \
              "$APP_PATH"
          else
            codesign \
              --force \
              --deep \
              --sign - \
              "$APP_PATH"
          fi

          echo "=== Code signature verification ==="

          codesign \
            --verify \
            --deep \
            --strict \
            "$APP_PATH"

          echo "=== Package Intel application ==="

          ditto \
            -c \
            -k \
            --keepParent \
            "$APP_PATH" \
            BiliKit-macOS26-Intel.zip
            
      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
