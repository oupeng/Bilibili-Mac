name: Build BiliKit for Intel Mac (macOS 26)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show toolchain version
        run: |
          sw_vers
          xcodebuild -version

      - name: Install Dependencies for Icon Processing
        run: |
          python3 -m pip install pillow --break-system-packages --quiet

      - name: Process Custom Icon & Generate macOS Dark Mode Assets
        run: |
          python3 -c '
          import os, sys, glob, json, shutil, subprocess

          icon_icns = "custom_icon.icns"
          iconset_dir = "temp_custom.iconset"
          generated_xcassets = "generated_appicon.xcassets/AppIcon.appiconset"

          if os.path.exists(icon_icns):
              print("Found custom_icon.icns, generating icon assets...")
              os.makedirs(iconset_dir, exist_ok=True)
              subprocess.run(["iconutil", "-c", "iconset", icon_icns, "-o", iconset_dir], check=True)
              
              from PIL import Image, ImageEnhance

              all_pngs = sorted(glob.glob(os.path.join(iconset_dir, "*.png")), key=lambda x: os.path.getsize(x), reverse=True)
              base_img = Image.open(all_pngs[0]).convert("RGBA") if all_pngs else None

              spec_list = [
                  (16, "1x", "icon_16x16.png", "icon_16x16_dark.png"),
                  (32, "2x", "icon_16x16@2x.png", "icon_16x16@2x_dark.png"),
                  (32, "1x", "icon_32x32.png", "icon_32x32_dark.png"),
                  (64, "2x", "icon_32x32@2x.png", "icon_32x32@2x_dark.png"),
                  (128, "1x", "icon_128x128.png", "icon_128x128_dark.png"),
                  (256, "2x", "icon_128x128@2x.png", "icon_128x128@2x_dark.png"),
                  (256, "1x", "icon_256x256.png", "icon_256x256_dark.png"),
                  (512, "2x", "icon_256x256@2x.png", "icon_256x256@2x_dark.png"),
                  (512, "1x", "icon_512x512.png", "icon_512x512_dark.png"),
                  (1024, "2x", "icon_512x512@2x.png", "icon_512x512@2x_dark.png"),
              ]

              def create_dark_variant(src_img):
                  r, g, b, a = src_img.split()
                  rgb = Image.merge("RGB", (r, g, b))
                  dark_rgb = ImageEnhance.Brightness(rgb).enhance(0.72)
                  dark_rgb = ImageEnhance.Contrast(dark_rgb).enhance(1.1)
                  dr, dg, db = dark_rgb.split()
                  return Image.merge("RGBA", (dr, dg, db, a))

              images_json = []

              for px, scale, light_fn, dark_fn in spec_list:
                  light_path = os.path.join(iconset_dir, light_fn)
                  dark_path = os.path.join(iconset_dir, dark_fn)

                  if os.path.exists(light_path):
                      img_light = Image.open(light_path).convert("RGBA")
                  else:
                      img_light = base_img.resize((px, px), Image.Resampling.LANCZOS)
                      img_light.save(light_path, "PNG")

                  img_dark = create_dark_variant(img_light)
                  img_dark.save(dark_path, "PNG")

                  divisor = 2 if scale == "2x" else 1
                  dim = px // divisor
                  size_str = f"{dim}x{dim}"
                  
                  images_json.append({
                      "size": size_str,
                      "idiom": "mac",
                      "filename": light_fn,
                      "scale": scale
                  })
                  images_json.append({
                      "size": size_str,
                      "idiom": "mac",
                      "filename": dark_fn,
                      "scale": scale,
                      "appearances": [
                          {
                              "appearance": "luminosity",
                              "value": "dark"
                          }
                      ]
                  })

              contents_json = {
                  "images": images_json,
                  "info": {
                      "author": "xcode",
                      "version": 1
                  }
              }

              # 创建准备后续覆盖使用的 AppIcon.appiconset 目录
              os.makedirs(generated_xcassets, exist_ok=True)
              for fname in os.listdir(iconset_dir):
                  if fname.endswith(".png"):
                      shutil.copy2(os.path.join(iconset_dir, fname), os.path.join(generated_xcassets, fname))
              with open(os.path.join(generated_xcassets, "Contents.json"), "w", encoding="utf-8") as f:
                  json.dump(contents_json, f, indent=2)

              # 顺带同步更新项目中现有的所有 .xcassets
              for root, dirs, files in os.walk("."):
                  for d in dirs:
                      if d.endswith(".xcassets") and "generated_appicon.xcassets" not in root:
                          appicon_dir = os.path.join(root, d, "AppIcon.appiconset")
                          os.makedirs(appicon_dir, exist_ok=True)
                          for f in os.listdir(appicon_dir):
                              os.remove(os.path.join(appicon_dir, f))
                          for fname in os.listdir(iconset_dir):
                              if fname.endswith(".png"):
                                  shutil.copy2(os.path.join(iconset_dir, fname), os.path.join(appicon_dir, fname))
                          with open(os.path.join(appicon_dir, "Contents.json"), "w", encoding="utf-8") as f:
                              json.dump(contents_json, f, indent=2)

              # 替换源码中所有残留的 .icns
              for root, dirs, files in os.walk("."):
                  for file in files:
                      if file.endswith(".icns") and file != "custom_icon.icns":
                          target_icns = os.path.join(root, file)
                          shutil.copy2(icon_icns, target_icns)
                          print(f"Replaced source ICNS: {target_icns}")
          else:
              print("::error:: custom_icon.icns not found in root directory!")
              sys.exit(1)
          '

      - name: Apply All Patches (Warnings, Syntax, Keychain, Sandbox & Updater)
        run: |
          python3 -c '
          import os, re

          # 1. 消除 -warnings-as-errors 冲突
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith((".swift", ".pbxproj", ".xcconfig")):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              content = f.read()
                          if "-warnings-as-errors" in content:
                              content = content.replace("-warnings-as-errors", "-DNO_WERROR")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(content)
                      except Exception:
                          pass

          # 2. 修复 URLSessionRangeTransport.swift 循环引用
          target_file = "Packages/BiliKitCore/Sources/BiliNetworking/Range/URLSessionRangeTransport.swift"
          if os.path.exists(target_file):
              with open(target_file, "r", encoding="utf-8") as f:
                  content = f.read()
              if "let (pending, session) = lock.withLock" in content:
                  content = content.replace("let (pending, session) = lock.withLock", "let (pending, activeSession) = lock.withLock")
                  content = content.replace("session?.finishTasksAndInvalidate()", "activeSession?.finishTasksAndInvalidate()")
                  content = content.replace("session?.invalidateAndCancel()", "activeSession?.invalidateAndCancel()")
                  content = content.replace("session.invalidateAndCancel()", "activeSession.invalidateAndCancel()")
                  with open(target_file, "w", encoding="utf-8") as f:
                      f.write(content)

          # 3. 修复 NSColor.quinaryLabelColor 重命名
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".swift"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              c = f.read()
                          if "quinaryLabelColor" in c:
                              c = c.replace("quinaryLabelColor", "quinaryLabel")
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(c)
                      except Exception:
                          pass

          # 4. 关键修复：关闭 App Sandbox 与 Keychain Access Groups（根除登录失败）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file.endswith(".entitlements"):
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              ent = f.read()
                          # 关闭沙盒
                          ent = re.sub(r"<key>com.apple.security.app-sandbox</key>\s*<true/>", "<key>com.apple.security.app-sandbox</key><false/>", ent)
                          # 移除钥匙串共享组
                          ent = re.sub(r"<key>keychain-access-groups</key>\s*<array>.*?</array>", "", ent, flags=re.DOTALL)
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(ent)
                          print(f"Patched entitlements: {path}")
                      except Exception:
                          pass

          # 5. 关键修复：禁用 Sparkle 自动更新检查（避免自动下载纯 M 芯片版本覆盖损坏）
          for root, dirs, files in os.walk("."):
              for file in files:
                  if "Info.plist" in file:
                      path = os.path.join(root, file)
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              plist = f.read()
                          if "</dict>" in plist:
                              sparkle_block = "<key>SUEnableAutomaticChecks</key><false/><key>SUAutomaticallyUpdate</key><false/>\n</dict>"
                              plist = plist.replace("</dict>", sparkle_block, 1)
                              with open(path, "w", encoding="utf-8") as f:
                                  f.write(plist)
                              print(f"Disabled Sparkle auto-update in: {path}")
                      except Exception:
                          pass

          print("All deep patches finished successfully!")
          '

      - name: Build BiliKitMac for Intel (x86_64)
        run: |
          SCHEME="BiliKitMac"
          if ! xcodebuild -list -project BiliKitMac.xcodeproj | grep -q "BiliKitMac"; then
            SCHEME="BiliKit"
          fi
          echo "Selected App Scheme: $SCHEME"

          xcodebuild build \
            -project BiliKitMac.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'platform=macOS,arch=x86_64' \
            ARCHS="x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_SUPPRESS_WARNINGS=NO \
            GCC_WARN_INHIBIT_ALL_WARNINGS=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath ./DerivedData

      - name: Ad-hoc Sign and Package Intel App
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products/Release -maxdepth 2 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::未在 DerivedData 中找到编译生成的 .app 文件！"
            exit 1
          fi

          echo "=== 强制重构应用包图标资源 ==="
          if [ -f "custom_icon.icns" ]; then
              # 1. 替换 Resources 目录下所有的 .icns 文件
              find "$APP_PATH/Contents/Resources" -name "*.icns" -exec cp custom_icon.icns {} \;
              cp custom_icon.icns "$APP_PATH/Contents/Resources/AppIcon.icns"

              # 2. 关键修复：彻底删除 xcodebuild 从 AppIcon.icon 编译出的旧 Assets.car
              rm -f "$APP_PATH/Contents/Resources/Assets.car"

              # 3. 收集所有 .xcassets，一次性调用 actool 重新编译出全新的 Assets.car
              XCASSETS_ARGS=""
              for xcas in $(find . -name "*.xcassets"); do
                  XCASSETS_ARGS="$XCASSETS_ARGS $xcas"
              done
              echo "Recompiling pristine Assets.car with:$XCASSETS_ARGS"

              xcrun actool $XCASSETS_ARGS \
                --compile "$APP_PATH/Contents/Resources" \
                --platform macosx \
                --target-device mac \
                --minimum-deployment-target 11.0 \
                --app-icon AppIcon \
                --output-format human-readable-text

              # 4. 修正 Info.plist 保证 100% 匹配
              PLIST_PATH="$APP_PATH/Contents/Info.plist"
              if [ -f "$PLIST_PATH" ]; then
                  python3 -c '
                  import plistlib, sys
                  plist_path = sys.argv[1]
                  with open(plist_path, "rb") as f:
                      data = plistlib.load(f)
                  data["CFBundleIconFile"] = "AppIcon"
                  data["CFBundleIconName"] = "AppIcon"
                  with open(plist_path, "wb") as f:
                      plistlib.dump(data, f)
                  print("Info.plist icon keys updated successfully.")
                  ' "$PLIST_PATH"
              fi
          fi

          # 5. 刷新包修改时间，强制 macOS Finder 重新读取缓存
          touch "$APP_PATH"

          echo "=== 架构验证 ==="
          lipo -info "$APP_PATH/Contents/MacOS/"*

          # 使用修改后的 Entitlements（非沙盒）重新自签名
          ENT_FILE=$(find . -name "*.entitlements" | head -n 1)
          if [ -n "$ENT_FILE" ]; then
              echo "Signing with non-sandbox entitlements: $ENT_FILE"
              codesign --force --deep --sign - --entitlements "$ENT_FILE" "$APP_PATH"
          else
              codesign --force --deep --sign - "$APP_PATH"
          fi

          ditto -c -k --keepParent "$APP_PATH" BiliKit-macOS26-Intel.zip

      - name: Upload Intel App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BiliKit-macOS26-Intel-Client
          path: BiliKit-macOS26-Intel.zip
          retention-days: 7
