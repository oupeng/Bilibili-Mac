// Clean-room schema derived from BiliKit's own M4 contract observations.
// Keep generator and runtime pinned to SwiftProtobuf 1.38.1 (docs/ARCHITECTURE.md).
syntax = "proto3";

package bilikit.danmaku;

message SegmentReply {
  repeated Element elements = 1;
}

message Element {
  int64 id = 1;
  int32 progress_milliseconds = 2;
  int32 mode = 3;
  int32 font_size = 4;
  // Base RRGGBB color. Presentation metadata remains in separate fields.
  uint32 color_rgb = 5;
  string sender_hash = 6;
  string content = 7;
  int64 created_at = 8;
  int32 weight = 9;
  string action = 10;
  int32 pool = 11;
  string id_string = 12;
  int32 attributes = 13;
  // Colorful style; 60001 is the VIP gradient (white fill, gradient outline).
  int32 colorful = 24;
}

// `/x/v2/dm/web/view` reply; only the interactive (command) danmaku list is read.
message ViewReply {
  repeated CommandElement command_elements = 9;
}

// One interactive danmaku. Field 3 (sender mid) arrives as a varint even though
// older community schemas declare it as a string; it is not needed and not declared.
message CommandElement {
  int64 id = 1;
  string command = 4;
  string content = 5;
  int32 progress_milliseconds = 6;
  // JSON object whose shape depends on `command`.
  string extra = 9;
  string id_string = 10;
}
